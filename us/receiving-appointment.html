<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入库预约管理 - 海外仓</title>
  <link href="css/vendor/overseawh-legacy/bootstrap.css" rel="stylesheet" type="text/css">
  <link href="css/vendor/overseawh-legacy/main.css" rel="stylesheet" type="text/css">
  <link href="css/vendor/overseawh-legacy/order-return-record-prototype-addon.css" rel="stylesheet" type="text/css">
  <link href="css/receiving-appointment-reminder.css" rel="stylesheet" type="text/css">
</head>
<body>

<div id="wedo-overseas-chrome-header"></div>

<div class="container-fluid conter_menu" id="recv-wrap">
  <div id="enter" class="subnav mywell padding8">
    <div class="control-group">
      <form class="form-inline" onsubmit="return false;">
        <div class="paddleft10">
          预约单号：<input type="text" id="q_appointment_no" class="span2" style="width:160px;" placeholder="模糊" autocomplete="off">
          送仓码：<input type="text" id="q_delivery_code" class="span2" style="width:140px;" placeholder="模糊" autocomplete="off">
          预约方：<input type="text" id="q_booker" class="span2" style="width:160px;" placeholder="客户编号/运德船务" autocomplete="off">
          目的仓：
          <select id="q_warehouse" class="span2" style="width:140px;">
            <option value="">全部</option>
          </select>
          送仓类型：
          <select id="q_delivery_type" class="span2" style="width:120px;">
            <option value="">全部</option>
            <option value="整柜">整柜</option>
            <option value="散货">散货</option>
          </select>
          <br>
          集装箱号：<input type="text" id="q_container_no" class="span2" style="width:160px;" placeholder="模糊" autocomplete="off">
          提交时间：
          <input type="date" id="q_submit_start" class="span2" style="width:140px;">
          ~
          <input type="date" id="q_submit_end" class="span2" style="width:140px;">
          <button type="button" class="btn" id="btn_recv_query">查询</button>
          <a href="pda-receiving-scan.html" class="btn btn-info" style="margin-left:8px;">PDA收货扫描</a>
          <button type="button" class="btn" id="btn_recv_reset">重置</button>
        </div>
      </form>
    </div>
  </div>

  <div class="subnav mywell padding8 order-return-prototype-subnav" id="recv-tab-subnav">
    <ul class="nav nav-pills" id="statusTabs"></ul>
  </div>

  <div class="container-fluid padding10 well" style="box-sizing:border-box;overflow-x:auto;">
    <div>Your search results is <span class="badge badge-info" id="result-total">0</span></div>
    <table class="table table-hover order-return-prototype-table" id="recv-table">
      <thead>
        <tr class="info">
          <th>预约单号</th>
          <th>送仓码</th>
          <th>预约方</th>
          <th>状态</th>
          <th>送仓类型</th>
          <th>期望送仓日期</th>
          <th>仓库确认时段</th>
          <th>实际到仓时间段</th>
          <th>集装箱号</th>
          <th>送仓总箱数</th>
          <th>收货总箱数</th>
          <th>是否打托</th>
          <th>送仓总托数</th>
          <th>提交时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="recv-list-tbody"></tbody>
    </table>
  </div>

  <div class="pagination pagination-centered pagination-prototype">
    <span id="page-info"></span>
    <button type="button" class="btn btn-small" id="btn_prev_page">上一页</button>
    <button type="button" class="btn btn-small" id="btn_next_page">下一页</button>
  </div>
</div>

<footer class="footer">
  <div class="container">
    Copyright &copy; 运德供应链 &middot; 入库预约管理
  </div>
</footer>

<script src="js/vendor/overseawh-legacy/jquery-1.8.3.min.js" type="text/javascript"></script>
<script src="js/vendor/overseawh-legacy/bootstrap.min.js" type="text/javascript"></script>
<script src="js/overseawh-chrome.js" type="text/javascript"></script>
<script type="text/javascript">
  WedoOverseasChrome.mountHeader('#wedo-overseas-chrome-header', {
    activeSecondMenu: 'receivingAppointmentMgmt',
    activeWarehouseIndex: 0,
    userName: '演示用户',
    assetsRoot: 'css/vendor/'
  });
</script>
<script src="../mock_data/deliveryAppointment.js"></script>
<script src="../mock_data/inOrder.js"></script>
<script src="../customer/js/deliveryAppointment-common.js"></script>
<script src="js/receiving-appointment-list.js"></script>
<script src="js/receiving-appointment-reminder.js"></script>
</body>
</html>
