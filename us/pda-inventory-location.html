<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PDA 指令盘点 - 海外仓</title>
  <link rel="stylesheet" href="css/pda.css">
</head>
<body class="pda-body pda-theme-scan">
  <div class="pda-view"><main class="pda-main"><section class="pda-page"><h1 class="pda-page-title">指令盘点</h1><table class="pda-ris-table pda-location-form"><tr><td class="pda-ris-label">料号:</td><td><input id="skuInput" class="pda-ris-input pda-location-readonly" readonly></td></tr><tr><td class="pda-ris-label">待盘点仓位:</td><td><div class="pda-location-select-wrap"><select id="locationInput" class="pda-ris-input"></select><button type="button" id="btnCallAutoWarehouse" class="pda-location-call" disabled>CALL</button></div></td></tr><tr><td class="pda-ris-label">系统库存:</td><td id="expectedQty" class="pda-ris-val pda-location-stock">-</td></tr><tr><td class="pda-ris-label">盘点原因:</td><td><select class="pda-ris-input pda-location-disabled" disabled><option>循环盘点</option></select></td></tr><tr><td class="pda-ris-label">实际库存:</td><td><input id="countInput" type="number" min="0" step="1" class="pda-ris-input" inputmode="numeric"></td></tr></table><div class="pda-ris-mstatus" id="countStatus"></div><div class="pda-actions"><button class="pda-ris-btn-footer pda-ris-btn-primary" id="btnConfirmLine">提交</button><button class="pda-ris-btn-footer" id="btnExit">退出</button></div></section></main></div>
  <script src="../mock_data/inventoryStock.js"></script><script src="../mock_data/inventoryInstruction.js"></script><script src="../mock_data/inventoryInstruction-common.js"></script><script src="js/pda-inventory-location.js"></script>
</body>
</html>
