<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约送仓管理</title>
  <link rel="stylesheet" href="css/customer-common.css" />
  <link rel="stylesheet" href="css/delivery-appointment.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <div class="logo-icon">仓</div>
        <span>运德仓储系统</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="top-icon">🔔 消息</span>
      <span class="top-icon">⚙ 设置</span>
      <span class="top-icon">Hello！郑乔俊</span>
      <span class="top-icon">退出</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-section">
        <div class="menu-section-title">主菜单</div>
        <div class="menu-item"><div class="menu-label">🏠 首页</div></div>
        <div class="menu-item"><div class="menu-label">📦 产品管理</div></div>
        <div class="menu-item" id="docManageBtn">
          <div class="menu-label">📑 单据管理</div>
          <span>▾</span>
        </div>
        <div class="submenu show" id="docManageSubmenu">
          <div class="menu-item"><a href="inOrder.html">入库单</a></div>
          <div class="menu-item active"><a href="deliveryAppointment.html">预约送仓</a></div>
          <div class="menu-item">出库单</div>
          <div class="menu-item">调拨单</div>
        </div>
        <div class="menu-item"><div class="menu-label">🛠 服务工单</div></div>
        <div class="menu-item"><div class="menu-label">📊 数据统计</div></div>
        <div class="menu-item"><div class="menu-label">👤 用户中心</div></div>
      </div>
    </aside>

    <main class="content">
      <div class="breadcrumb">单据管理 &gt;&gt; 预约送仓</div>

      <div class="panel filter-panel">
        <div class="filter-row">
          <div class="form-item">
            <label>预约单号：</label>
            <input class="input" id="filterAppointmentNo" type="text" placeholder="请输入预约单号" />
          </div>
          <div class="form-item">
            <label>预约仓库：</label>
            <select class="select" id="filterWarehouse"><option value="">全部</option></select>
          </div>
          <div class="form-item">
            <label>送仓类型：</label>
            <select class="select" id="filterDeliveryType">
              <option value="">全部</option>
              <option value="整柜">整柜</option>
              <option value="散货">散货</option>
            </select>
          </div>
          <div class="btn-group">
            <button class="btn btn-search" id="searchBtn" type="button">查询</button>
            <button class="btn btn-reset" id="resetBtn" type="button">重置</button>
          </div>
        </div>
        <div class="filter-row">
          <div class="form-item">
            <label>状态：</label>
            <select class="select" id="filterStatus"><option value="">全部</option></select>
          </div>
        </div>
      </div>

      <div class="panel tab-panel">
        <div class="tabs" id="tabs"></div>
      </div>

      <div class="panel">
        <div class="table-header">
          <div class="table-title">预约送仓列表</div>
          <a href="deliveryAppointmentCreate.html" class="btn btn-primary">新建预约</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>预约仓库</th>
                <th>预约单号</th>
                <th>送仓码</th>
                <th>状态</th>
                <th>送仓类型</th>
                <th>送仓总箱数</th>
                <th>收货总箱数</th>
                <th>是否打托</th>
                <th>送仓总托数</th>
                <th>期望送仓日期</th>
                <th>仓库确认时段</th>
                <th>实际送仓时间</th>
                <th>提交时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <script src="../mock_data/deliveryAppointment.js"></script>
  <script src="js/deliveryAppointment-common.js"></script>
  <script src="js/deliveryAppointmentList.js"></script>
</body>
</html>
