<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约送仓管理</title>
  <link rel="stylesheet" href="css/customer-common.css" />
  <link rel="stylesheet" href="css/delivery-appointment.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <div class="logo-icon">仓</div>
        <span>运德仓储系统</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="top-icon">🔔 消息</span>
      <span class="top-icon">⚙ 设置</span>
      <span class="top-icon">Hello！郑乔俊</span>
      <span class="top-icon">退出</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-section">
        <div class="menu-section-title">主菜单</div>
        <div class="menu-item"><div class="menu-label">🏠 首页</div></div>
        <div class="menu-item" id="productManageBtn">
          <div class="menu-label">📦 产品管理</div>
          <span>▾</span>
        </div>
        <div class="submenu" id="productManageSubmenu">
          <div class="menu-item"><a href="productList.html">产品列表</a></div>
          <div class="menu-item"><a href="productCreate.html">新增产品</a></div>
          <div class="menu-item">批量导入</div>
        </div>
        <div class="menu-item" id="docManageBtn">
          <div class="menu-label">📑 单据管理</div>
          <span>▾</span>
        </div>
        <div class="submenu show" id="docManageSubmenu">
          <div class="menu-item"><a href="inOrder.html">入库单</a></div>
          <div class="menu-item active"><a href="deliveryAppointment.html">预约送仓</a></div>
          <div class="menu-item">出库单</div>
          <div class="menu-item">调拨单</div>
        </div>
        <div class="menu-item"><div class="menu-label">🛠 服务工单</div></div>
        <div class="menu-item"><div class="menu-label">📊 数据统计</div></div>
        <div class="menu-item"><div class="menu-label">👤 用户中心</div></div>
      </div>
    </aside>

    <main class="content">
      <div class="breadcrumb">单据管理 &gt;&gt; 预约送仓</div>

      <div class="panel filter-panel" id="appointmentFilterPanel">
        <div class="filter-row">
          <div class="form-item">
            <label>预约单号：</label>
            <input class="input filter-input" id="filterAppointmentNo" type="text" placeholder="模糊搜索" />
          </div>
          <div class="form-item">
            <label>送仓码：</label>
            <input class="input filter-input" id="filterDeliveryCode" type="text" placeholder="模糊搜索" />
          </div>
          <div class="form-item">
            <label>预约仓库：</label>
            <select class="select" id="filterWarehouse"><option value="">全部</option></select>
          </div>
          <div class="form-item">
            <label>送仓类型：</label>
            <select class="select" id="filterDeliveryType">
              <option value="">全部</option>
              <option value="整柜">整柜</option>
              <option value="散货">散货</option>
            </select>
          </div>
          <div class="btn-group">
            <button class="btn btn-search" id="searchBtn" type="button">查询</button>
            <button class="btn btn-reset" id="resetBtn" type="button">重置</button>
          </div>
        </div>
        <div class="filter-row">
          <div class="form-item">
            <label>状态：</label>
            <select class="select" id="filterStatus"><option value="">全部</option></select>
          </div>
          <div class="form-item">
            <label>入库单号：</label>
            <input class="input filter-input" id="filterInboundDetail" type="text" placeholder="支持逗号分隔" />
          </div>
          <div class="form-item">
            <label>是否打托：</label>
            <select class="select" id="filterPalletized">
              <option value="">全部</option>
              <option value="yes">是</option>
              <option value="no">否</option>
            </select>
          </div>
          <div class="form-item">
            <label>送仓总箱数：</label>
            <input class="input filter-input" id="filterEstimatedCartons" type="text" placeholder="模糊搜索" />
          </div>
          <div class="form-item">
            <label>集装箱号：</label>
            <input class="input filter-input" id="filterContainerNo" type="text" placeholder="整柜模糊搜索" />
          </div>
        </div>
        <div class="filter-row">
          <div class="form-item">
            <label>总体积（m³）：</label>
            <input class="input filter-input" id="filterTotalVolume" type="text" placeholder="模糊搜索" />
          </div>
          <div class="form-item">
            <label>总重量（kg）：</label>
            <input class="input filter-input" id="filterTotalWeight" type="text" placeholder="模糊搜索" />
          </div>
          <div class="form-item">
            <label>货代联系邮箱：</label>
            <input class="input filter-input" id="filterEmail" type="text" placeholder="模糊搜索" />
          </div>
        </div>
        <div class="filter-row filter-row-dates">
          <div class="form-item">
            <label>提交时间：</label>
            <span class="filter-date-range">
              <input class="input filter-input" id="filterSubmitTimeStart" type="date" />
              <span class="filter-date-sep">至</span>
              <input class="input filter-input" id="filterSubmitTimeEnd" type="date" />
            </span>
          </div>
          <div class="form-item">
            <label>期望送仓日期：</label>
            <span class="filter-date-range">
              <input class="input filter-input" id="filterExpectedTimeStart" type="date" />
              <span class="filter-date-sep">至</span>
              <input class="input filter-input" id="filterExpectedTimeEnd" type="date" />
            </span>
          </div>
          <div class="form-item">
            <label>实际到仓时间：</label>
            <span class="filter-date-range">
              <input class="input filter-input" id="filterActualTimeStart" type="date" />
              <span class="filter-date-sep">至</span>
              <input class="input filter-input" id="filterActualTimeEnd" type="date" />
            </span>
          </div>
        </div>
        <p class="filter-result-hint" id="filterResultHint"></p>
      </div>

      <div class="panel tab-panel">
        <div class="tabs" id="tabs"></div>
      </div>

      <div class="panel">
        <div class="table-header">
          <div class="table-title">预约送仓列表</div>
          <div class="table-header-actions">
            <div class="table-col-picker" id="colPickerWrap">
              <button type="button" class="btn btn-link" id="btnColSettings" aria-expanded="false" aria-haspopup="true">列设置</button>
              <div class="col-picker-dropdown" id="colPickerDropdown" hidden></div>
            </div>
            <a href="deliveryAppointmentCreate.html" class="btn btn-primary">新建预约</a>
          </div>
        </div>
        <div class="table-wrap">
          <table id="appointmentTable">
            <thead>
              <tr>
                <th data-col-key="warehouse" class="col-toggleable">预约仓库</th>
                <th data-col-key="appointmentNo" class="col-toggleable">预约单号</th>
                <th data-col-key="status" class="col-toggleable">状态</th>
                <th data-col-key="deliveryCode" class="col-toggleable">送仓码</th>
                <th data-col-key="bookingLink" class="col-toggleable">预约链接</th>
                <th data-col-key="inboundDetail" class="col-toggleable">货物明细</th>
                <th data-col-key="estimatedCartons" class="col-toggleable">送仓总箱数</th>
                <th data-col-key="containerNo" class="col-toggleable">集装箱号</th>
                <th data-col-key="expectedInboundTime" class="col-toggleable">期望送仓时间</th>
                <th data-col-key="actualDeliveryTime" class="col-toggleable">实际到仓时间</th>
                <th data-col-key="deliveryType" class="col-toggleable">送仓类型</th>
                <th data-col-key="totalPallets" class="col-toggleable">送仓总托数</th>
                <th data-col-key="totalVolume" class="col-toggleable">总体积（m³）</th>
                <th data-col-key="totalWeight" class="col-toggleable">总重量（kg）</th>
                <th data-col-key="isPalletized" class="col-toggleable">是否打托</th>
                <th data-col-key="submitTime" class="col-toggleable">提交时间</th>
                <th data-col-key="ops">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <div class="cust-modal-overlay" id="modalInboundDetail" style="display:none;" aria-hidden="true">
    <div class="cust-modal cust-modal--wide" role="dialog" aria-labelledby="modalInboundDetailTitle">
      <h3 class="cust-modal-title" id="modalInboundDetailTitle">货物明细</h3>
      <p class="cust-modal-subtitle" id="modalInboundDetailSubtitle"></p>
      <div class="cust-modal-body">
        <div class="sub-table-wrap">
          <table class="sub-table">
            <thead>
              <tr>
                <th>入库单号</th>
                <th>订单状态</th>
                <th>收货仓</th>
                <th>发货方式</th>
                <th>订单箱数</th>
                <th>送仓箱数</th>
                <th>提交时间</th>
              </tr>
            </thead>
            <tbody id="modalInboundDetailBody"></tbody>
          </table>
        </div>
      </div>
      <div class="cust-modal-footer">
        <button type="button" class="btn btn-primary" id="modalInboundDetailClose">关闭</button>
      </div>
    </div>
  </div>

  <script src="../mock_data/warehouses.js"></script>
  <script src="../mock_data/deliveryAppointment.js"></script>
  <script src="js/product-common.js"></script>
  <script src="js/deliveryAppointment-common.js"></script>
  <script src="js/deliveryAppointmentList.js"></script>
</body>
</html>
