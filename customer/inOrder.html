<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>入库单管理</title>
  <link rel="stylesheet" href="css/customer-common.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <div class="logo-icon">仓</div>
        <span>运德仓储系统</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="top-icon">🔔 消息</span>
      <span class="top-icon">⚙ 设置</span>
      <span class="top-icon">Hello！郑乔俊</span>
      <span class="top-icon">退出</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-section">
        <div class="menu-section-title">主菜单</div>
        <div class="menu-item">
          <div class="menu-label">🏠 首页</div>
        </div>
        <div class="menu-item" id="productManageBtn">
          <div class="menu-label">📦 产品管理</div>
          <span>▾</span>
        </div>
        <div class="submenu" id="productManageSubmenu">
          <div class="menu-item"><a href="productList.html">产品列表</a></div>
          <div class="menu-item"><a href="productCreate.html">新增产品</a></div>
          <div class="menu-item">批量导入</div>
        </div>

        <div class="menu-item" id="docManageBtn">
          <div class="menu-label">📑 单据管理</div>
          <span>▾</span>
        </div>
        <div class="submenu show" id="docManageSubmenu">
          <div class="menu-item active"><a href="inOrder.html">入库单</a></div>
          <div class="menu-item"><a href="deliveryAppointment.html">预约送仓</a></div>
          <div class="menu-item">出库单</div>
          <div class="menu-item">调拨单</div>
        </div>

        <div class="menu-item">
          <div class="menu-label">🛠 服务工单</div>
        </div>
        <div class="menu-item">
          <div class="menu-label">📊 数据统计</div>
        </div>
        <div class="menu-item">
          <div class="menu-label">👤 用户中心</div>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="breadcrumb">单据管理 &gt;&gt; 入库单</div>

      <div class="panel filter-panel">
        <div class="filter-row">
          <div class="form-item">
            <label>入库单号：</label>
            <input class="input" id="orderNo" type="text" placeholder="请输入入库单号" />
          </div>
          <div class="form-item">
            <label>海外仓货仓：</label>
            <select class="select" id="warehouse">
              <option value="">全部</option>
            </select>
          </div>
          <div class="form-item">
            <label>发货方式：</label>
            <select class="select" id="shippingType">
              <option value="">全部</option>
            </select>
          </div>
          <div class="btn-group">
            <button class="btn btn-search" id="searchBtn">查询</button>
            <button class="btn btn-reset" id="resetBtn">重置</button>
          </div>
        </div>

        <div class="filter-row">
          <div class="form-item">
            <label>快递单号：</label>
            <input class="input" id="expressNo" type="text" placeholder="请输入快递单号" />
          </div>
          <div class="form-item">
            <label>状态：</label>
            <select class="select" id="status">
              <option value="">全部</option>
            </select>
          </div>
        </div>
      </div>

      <div class="panel tab-panel">
        <div class="tabs" id="tabs"></div>
      </div>

      <div class="panel">
        <div class="table-header">
          <div class="table-title">入库单列表</div>
          <button class="btn btn-primary">新增入库单</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:50px;"><input class="checkbox" id="checkAll" type="checkbox" /></th>
                <th>入库单号</th>
                <th>收货仓</th>
                <th>发货方式</th>
                <th>快递单号</th>
                <th>箱数</th>
                <th>件数</th>
                <th>重量(KG)</th>
                <th>体积(CBM)</th>
                <th>创建时间</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <script src="../mock_data/warehouses.js"></script>
  <script src="../mock_data/inOrder.js"></script>
  <script src="js/product-common.js"></script>
  <script src="inOrder.js"></script>
</body>
</html>
